name: Build Luu Le public translations (VI EN ZH)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-i18n.yml'
      - 'tools/build_translations.py'
      - 'tools/apply_reviewed_translations.py'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: 'Internal: automatic follow-up batch number (leave 0 for manual run)'
        required: false
        default: '0'
        type: string
  schedule:
    # Daily maintenance: detect new or edited public pages.
    - cron: '17 3 * * *'
    # Accelerated backlog processing every 4 hours, until complete or stalled.
    - cron: '47 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: luule-i18n-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Always start from the freshest main, including a manually rerun old job.
      # Combined with workflow-wide concurrency, this prevents stale batches.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether a translation batch is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          manifest = read('public/i18n/manifest.json', {})
          state = read('.ll-i18n-state.json', {})
          cache = read('translation-cache.json', {})
          remaining = int(manifest.get('pages_pending', 1))
          stalls = int(state.get('no_progress_runs', 0))
          fast = (os.getenv('EVENT_NAME') == 'schedule' and
                  os.getenv('EVENT_SCHEDULE') == '47 */4 * * *')
          do_build = not (fast and (remaining == 0 or stalls >= 2))

          print(f'Pages pending: {remaining}; no-progress runs: {stalls}; '
                f'expedited: {fast}; build: {do_build}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'build={str(do_build).lower()}\n')
              output.write(f'before_count={len(cache) if isinstance(cache, dict) else 0}\n')
              output.write(f'before_published={int(manifest.get("pages_published", 0))}\n')
              output.write(f'before_packs_total={int(manifest.get("published_pack_files_total", 0))}\n')
              output.write(f'before_pending={remaining}\n')
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.build == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test parser
        if: steps.gate.outputs.build == 'true'
        run: python tools/build_translations.py --self-test

      - name: Verify language switcher in simulated browser
        if: steps.gate.outputs.build == 'true'
        run: python tools/test_browser_mock.py

      - name: Generate public translation packs
        if: steps.gate.outputs.build == 'true'
        env:
          LL_MAX_PAGES: '1200'
          LL_MAX_NEW: '12000'
        run: python tools/build_translations.py --browser

      - name: Apply reviewed homepage and terminology translations
        if: steps.gate.outputs.build == 'true'
        run: python tools/apply_reviewed_translations.py

      - name: Update progress and stop repeated no-progress batches
        if: steps.gate.outputs.build == 'true'
        env:
          BEFORE_COUNT: ${{ steps.gate.outputs.before_count }}
          BEFORE_PUBLISHED: ${{ steps.gate.outputs.before_published }}
          BEFORE_PACKS_TOTAL: ${{ steps.gate.outputs.before_packs_total }}
          BEFORE_PENDING: ${{ steps.gate.outputs.before_pending }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          state_path = Path('.ll-i18n-state.json')
          state = read(state_path, {})
          cache = read('translation-cache.json', {})
          manifest = read('public/i18n/manifest.json', {})
          count = len(cache) if isinstance(cache, dict) else 0
          published = int(manifest.get('pages_published', 0))
          pending = int(manifest.get('pages_pending', 0))
          total_packs = int(manifest.get('published_pack_files_total', 0))
          was_pending = int(os.getenv('BEFORE_PENDING', pending))
          progressed = (count > int(os.getenv('BEFORE_COUNT', 0)) or
                        total_packs > int(os.getenv('BEFORE_PACKS_TOTAL', 0)) or
                        (pending < was_pending))
          state['no_progress_runs'] = (0 if progressed or pending == 0 else
              min(2, int(state.get('no_progress_runs', 0)) + 1))
          state['last_cache_entries'] = count
          state['last_pages_published'] = published
          state['last_pages_pending'] = pending
          state['last_progressed'] = bool(progressed)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                                encoding='utf-8')
          print(f'Cache: {count}; total published packs: {total_packs}; '
                f'pages pending: {pending}; progress: {progressed}; '
                f'stalls: {state["no_progress_runs"]}')
          PY

      - name: Audit unresolved pages and why they are pending
        if: steps.gate.outputs.build == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return {}

          manifest = read('public/i18n/manifest.json')
          coverage = read('public/i18n/coverage.json')
          audit = read('public/i18n/audit.json')
          pending = audit.get('pending_pages') or []
          failed = coverage.get('skipped_or_failed') or []
          unvisited = coverage.get('unvisited_examples') or []
          print('---- PUBLIC TRANSLATION BACKLOG DIAGNOSTICS ----')
          print('Pages pending:', manifest.get('pages_pending', 'n/a'))
          print('Pages beyond crawl budget:', coverage.get('unvisited_count', 'n/a'))
          print('Pages lacking a pack beyond crawl budget:', coverage.get('unvisited_without_existing_pack', 'n/a'))
          print('Fetch failures:', len(failed))
          print('Pages with incomplete translations:', len(pending))
          print('Pending incomplete pages (up to 30):')
          for p in pending[:30]:
              print(' INCOMPLETE', p.get('route', ''), 'missing texts:', p.get('missing_count', '?'))
          print('Failed URL fetches (up to 30):')
          for f in failed[:30]:
              print(' FETCH_ERROR', f.get('url', ''), ':', f.get('error', ''))
          print('Unvisited examples (up to 30):')
          for url in unvisited[:30]:
              print(' UNVISITED', url)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Translation backlog diagnostic\n\n')
              out.write(f'- Pending packs: {manifest.get("pages_pending", "n/a")}\n')
              out.write(f'- Unvisited URLs: {coverage.get("unvisited_count", "n/a")}\n')
              out.write(f'- Unvisited without a pack: {coverage.get("unvisited_without_existing_pack", "n/a")}\n')
              out.write(f'- Fetch errors: {len(failed)}\n')
              out.write(f'- Pages with missing translation strings: {len(pending)}\n')
              for row in pending[:12]:
                  out.write(f'  - {row.get("route", "unknown")}: {row.get("missing_count", "?")} strings missing\n')
              for row in failed[:8]:
                  out.write(f'  - Fetch error {row.get("url", "unknown")}: {str(row.get("error", ""))[:100]}\n')
          PY

      - name: Persist generated packs and progress
        id: persist
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuuLe-i18n-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add translation-cache.json public/i18n/ .ll-i18n-state.json
          if git diff --cached --quiet; then
            echo 'No new translations to commit.'
            echo 'result=published' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: refresh translation packs and progress'
          # Never force push. If main changed during this long build and JSON
          # cannot safely rebase, abort the stale commit and ask the next run
          # to rebuild FROM CURRENT MAIN. Existing published packs stay intact.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: fetching current main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::warning::Generated JSON conflicts with newer main. Keeping remote data; scheduling a fresh batch.'
              echo 'result=conflict' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo 'Successfully published translation packs and progress.'
              echo 'result=published' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Remote branch moved again (attempt ${attempt}); retrying."
            sleep $((attempt * 3))
          done
          echo '::error::Push rejected three times; check branch protection and repository permission.'
          exit 1

      - name: Automatically continue translation backlog
        # Runs AFTER saving results on main. GITHUB_TOKEN is enough:
        # workflow_dispatch is one of GitHub's permitted recursive events.
        if: steps.gate.outputs.build == 'true' && (steps.persist.outputs.result == 'published' || steps.persist.outputs.result == 'conflict')
        env:
          PERSIST_RESULT: ${{ steps.persist.outputs.result }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
          MAX_CHAIN_DEPTH: '8'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return {}

          manifest = load('public/i18n/manifest.json')
          state = load('.ll-i18n-state.json')
          pending = int(manifest.get('pages_pending', 0))
          stalls = int(state.get('no_progress_runs', 0))
          try:
              depth = max(0, int(os.getenv('CHAIN_DEPTH', '0')))
          except ValueError:
              depth = 0
          max_depth = max(1, min(12, int(os.getenv('MAX_CHAIN_DEPTH', '8'))))
          stale_conflict = (os.getenv('PERSIST_RESULT') == 'conflict')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'### Public translation coverage\n\n'
                        f'- Published JSON packs: {manifest.get("published_pack_files_total", "n/a")}\n'
                        f'- Pending / missing packs: {pending}\n'
                        f'- Runs without progress: {stalls}\n'
                        f'- Automatic chain depth: {depth}/{max_depth}\n'
                        f'- Publish outcome: {"CONFLICT, safe retry" if stale_conflict else "published or unchanged"}\n')

          # A conflict requires a fresh run even if the obsolete local manifest
          # reports no pending work. Read the newest main in the next batch.
          should_dispatch = False
          if stale_conflict:
              if depth < max_depth:
                  should_dispatch = True
                  print('Remote data changed during build; retry on latest main.')
              else:
                  print('Safety cap reached after conflict; next scheduled check can retry.')
          elif pending <= 0:
              print('Coverage complete for discovered URLs; daily schedule checks new posts.')
          elif stalls >= 2:
              print('No progress twice. Stop chain; daily maintenance may retry.')
          elif depth >= max_depth:
              print('Safety cap reached. Scheduled maintenance will resume.')
          else:
              should_dispatch = True

          if should_dispatch:
              url = (f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}'
                     '/actions/workflows/build-i18n.yml/dispatches')
              payload = json.dumps({
                  'ref': 'main',
                  'inputs': {'chain_depth': str(depth + 1)}
              }).encode('utf-8')
              request = Request(url, data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'LuuLePublicTranslationBot'
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError(f'Unexpected dispatch status: {response.status}')
                  print(f'Queued next automatic batch: {depth+1} / {max_depth}.')
              except HTTPError as exc:
                  print(f'::error::Auto-dispatch failed with HTTP {exc.code}. '
                        'Check Actions workflow permissions (actions: write).')
                  raise
          PY
