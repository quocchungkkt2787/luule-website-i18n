name: Build Luu Le public translations (VI EN ZH)

on:
  workflow_dispatch:
  schedule:
    # Daily maintenance: detect new or edited public pages.
    - cron: '17 3 * * *'
    # Accelerated backlog processing every 4 hours, until complete or stalled.
    - cron: '47 */4 * * *'

permissions:
  contents: write

concurrency:
  group: luule-i18n-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether a translation batch is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          manifest = read('public/i18n/manifest.json', {})
          state = read('.ll-i18n-state.json', {})
          cache = read('translation-cache.json', {})
          remaining = int(manifest.get('pages_pending', 1))
          stalls = int(state.get('no_progress_runs', 0))
          fast = (os.getenv('EVENT_NAME') == 'schedule' and
                  os.getenv('EVENT_SCHEDULE') == '47 */4 * * *')
          do_build = not (fast and (remaining == 0 or stalls >= 2))

          print(f'Pages pending: {remaining}; no-progress runs: {stalls}; '
                f'expedited: {fast}; build: {do_build}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'build={str(do_build).lower()}\n')
              output.write(f'before_count={len(cache) if isinstance(cache, dict) else 0}\n')
              output.write(f'before_published={int(manifest.get("pages_published", 0))}\n')
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.build == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test parser
        if: steps.gate.outputs.build == 'true'
        run: python tools/build_translations.py --self-test

      - name: Verify language switcher in simulated browser
        if: steps.gate.outputs.build == 'true'
        run: python tools/test_browser_mock.py

      - name: Generate public translation packs
        if: steps.gate.outputs.build == 'true'
        env:
          LL_MAX_PAGES: '450'
          LL_MAX_NEW: '8000'
        run: python tools/build_translations.py --browser

      - name: Apply reviewed homepage and terminology translations
        if: steps.gate.outputs.build == 'true'
        run: python tools/apply_reviewed_translations.py

      - name: Update progress and stop repeated no-progress batches
        if: steps.gate.outputs.build == 'true'
        env:
          BEFORE_COUNT: ${{ steps.gate.outputs.before_count }}
          BEFORE_PUBLISHED: ${{ steps.gate.outputs.before_published }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          state_path = Path('.ll-i18n-state.json')
          state = read(state_path, {})
          cache = read('translation-cache.json', {})
          manifest = read('public/i18n/manifest.json', {})
          count = len(cache) if isinstance(cache, dict) else 0
          published = int(manifest.get('pages_published', 0))
          pending = int(manifest.get('pages_pending', 0))
          progressed = (count > int(os.getenv('BEFORE_COUNT', 0)) or
                        published > int(os.getenv('BEFORE_PUBLISHED', 0)))
          state['no_progress_runs'] = (0 if progressed or pending == 0 else
              min(2, int(state.get('no_progress_runs', 0)) + 1))
          state['last_cache_entries'] = count
          state['last_pages_published'] = published
          state['last_pages_pending'] = pending
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                                encoding='utf-8')
          print(f'Cache: {count}; pages published: {published}; '
                f'pages pending: {pending}; stalls: {state["no_progress_runs"]}')
          PY

      - name: Persist generated packs and progress
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuuLe-i18n-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add translation-cache.json public/i18n/ .ll-i18n-state.json
          if git diff --cached --quiet; then
            echo 'No new translations to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh translation packs and progress'
          # Long-running translation builds may be behind the current main.
          # Rebase our generated commit onto the latest remote head; never force push.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: fetching current main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Generated files conflict with new remote commits. No force push was attempted.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Successfully published translation packs and progress.'
              exit 0
            fi
            echo "Branch main moved again or the push was rejected (attempt ${attempt})."
            sleep $((attempt * 3))
          done
          echo '::error::Push failed after 3 attempts. Check branch protection and workflow write permissions.'
          exit 1
