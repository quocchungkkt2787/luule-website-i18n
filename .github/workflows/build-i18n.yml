name: Build Luu Le public translations (VI EN ZH)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: luule-i18n-static
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test parser
        run: python tools/build_translations.py --self-test
      - name: Verify the language switcher in a simulated browser
        run: python tools/test_browser_mock.py
      - name: Generate public translation packs
        env:
          LL_MAX_PAGES: '450'
          LL_MAX_NEW: '8000'
        run: python tools/build_translations.py --browser
      - name: Persist generated packs
        run: |
          git config user.name 'LuuLe-i18n-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add translation-cache.json public/i18n/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public translation packs'
            git push
          fi
