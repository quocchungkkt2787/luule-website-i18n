name: Build Luu Le public translations (VI EN ZH)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-i18n.yml'
      - 'tools/build_translations.py'
      - 'tools/apply_reviewed_translations.py'
      - 'tools/ll-i18n-reviewed-translations.json'
      - 'tools/live_audit_i18n.py'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: 'Internal: automatic follow-up batch number (leave 0 for manual run)'
        required: false
        default: '0'
        type: string
  schedule:
    # Daily maintenance: detect new or edited public pages.
    - cron: '17 3 * * *'
    # Backup retry every 4 hours while translations remain (even after stall).
    - cron: '47 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: luule-i18n-static
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Always start from the freshest main, including a manually rerun old job.
      # Combined with workflow-wide concurrency, this prevents stale batches.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether a translation batch is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          manifest = read('public/i18n/manifest.json', {})
          audit = read('public/i18n/audit.json', {})
          coverage = read('public/i18n/coverage.json', {})
          state = read('.ll-i18n-state.json', {})
          cache = read('translation-cache.json', {})
          qa = read('public/i18n/live-qa.json', {})
          live_pending = int(qa.get('public_routes_pending', 1))
          # Do not confuse "published JSON pack exists" with "all text translated".
          pending_packs = int(manifest.get('pages_pending', 1))
          partial_pages = int(audit.get('pages_pending', 0))
          missing_texts = int(audit.get('missing_unique_texts', 0))
          uncrawled_without_pack = int(coverage.get('unvisited_without_existing_pack', 0))
          fetch_errors = len(coverage.get('skipped_or_failed', []))
          stalls = int(state.get('no_progress_runs', 0))
          fast = (os.getenv('EVENT_NAME') == 'schedule' and
                  os.getenv('EVENT_SCHEDULE') == '47 */4 * * *')
          unfinished = any((pending_packs, partial_pages, missing_texts,
                            uncrawled_without_pack, fetch_errors, live_pending))
          # Every manual/push/daily run scans for NEW pages. The 4-hour backup
          # also retries unfinished work even after a previously stalled chain.
          do_build = (not fast) or unfinished

          print(f'Pending packs: {pending_packs}; partial pages: {partial_pages}; '
                f'missing strings: {missing_texts}; unvisited missing packs: '
                f'{uncrawled_without_pack}; fetch errors: {fetch_errors}; '
                f'live QA pending: {live_pending}; no-progress runs: {stalls}; '
                f'expedited: {fast}; build: {do_build}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'build={str(do_build).lower()}\n')
              output.write(f'before_count={len(cache) if isinstance(cache, dict) else 0}\n')
              output.write(f'before_published={int(manifest.get("pages_published", 0))}\n')
              output.write(f'before_packs_total={int(manifest.get("published_pack_files_total", 0))}\n')
              output.write(f'before_pending={pending_packs}\n')
              output.write(f'before_partial={partial_pages}\n')
              output.write(f'before_missing_texts={missing_texts}\n')
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.build == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test parser
        if: steps.gate.outputs.build == 'true'
        run: python tools/build_translations.py --self-test

      - name: Verify language switcher in simulated browser
        if: steps.gate.outputs.build == 'true'
        run: python tools/test_browser_mock.py

      - name: Generate public translation packs
        if: steps.gate.outputs.build == 'true'
        env:
          LL_MAX_PAGES: '1200'
          LL_MAX_NEW: '12000'
        run: python tools/build_translations.py --browser

      - name: Apply reviewed homepage and terminology translations
        if: steps.gate.outputs.build == 'true'
        run: python tools/apply_reviewed_translations.py

      - name: Verify English and Chinese on anonymous public pages
        if: steps.gate.outputs.build == 'true'
        continue-on-error: true
        env:
          LL_QA_BATCH_SIZE: '8'
        run: python tools/live_audit_i18n.py

      - name: Update progress and measure continued live verification
        if: steps.gate.outputs.build == 'true'
        env:
          BEFORE_COUNT: ${{ steps.gate.outputs.before_count }}
          BEFORE_PUBLISHED: ${{ steps.gate.outputs.before_published }}
          BEFORE_PACKS_TOTAL: ${{ steps.gate.outputs.before_packs_total }}
          BEFORE_PENDING: ${{ steps.gate.outputs.before_pending }}
          BEFORE_PARTIAL: ${{ steps.gate.outputs.before_partial }}
          BEFORE_MISSING_TEXTS: ${{ steps.gate.outputs.before_missing_texts }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return default

          state_path = Path('.ll-i18n-state.json')
          state = read(state_path, {})
          cache = read('translation-cache.json', {})
          manifest = read('public/i18n/manifest.json', {})
          audit = read('public/i18n/audit.json', {})
          coverage = read('public/i18n/coverage.json', {})
          qa = read('public/i18n/live-qa.json', {})
          live_pending = int(qa.get('public_routes_pending', 1))
          live_verified = int(qa.get('public_routes_verified', 0))
          count = len(cache) if isinstance(cache, dict) else 0
          published = int(manifest.get('pages_published', 0))
          pending = int(manifest.get('pages_pending', 0))
          partial = int(audit.get('pages_pending', 0))
          missing_texts = int(audit.get('missing_unique_texts', 0))
          total_packs = int(manifest.get('published_pack_files_total', 0))
          failures = len(coverage.get('skipped_or_failed', []))
          unvisited_missing = int(coverage.get('unvisited_without_existing_pack', 0))
          unfinished = any((pending, partial, missing_texts, failures, unvisited_missing, live_pending))
          progressed = (count > int(os.getenv('BEFORE_COUNT', 0)) or
                        total_packs > int(os.getenv('BEFORE_PACKS_TOTAL', 0)) or
                        pending < int(os.getenv('BEFORE_PENDING', pending)) or
                        partial < int(os.getenv('BEFORE_PARTIAL', partial)) or
                        missing_texts < int(os.getenv('BEFORE_MISSING_TEXTS', missing_texts)) or
                        live_verified > int(state.get('last_live_qa_verified', 0)))
          # Keep measuring consecutive no-progress runs for diagnostics only.
          # The next run still follows while real-site EN/ZH QA is incomplete.
          state['no_progress_runs'] = (0 if progressed or not unfinished else
              min(3, int(state.get('no_progress_runs', 0)) + 1))
          state['last_cache_entries'] = count
          state['last_pages_published'] = published
          state['last_pages_pending'] = pending
          state['last_partial_pages'] = partial
          state['last_missing_texts'] = missing_texts
          state['last_progressed'] = bool(progressed)
          state['last_live_qa_verified'] = live_verified
          state['last_live_qa_pending'] = live_pending
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n',
                                encoding='utf-8')
          print(f'Cache: {count}; published packs: {total_packs}; pending packs: {pending}; '
                f'partial pages: {partial}; missing texts: {missing_texts}; '
                f'unvisited without pack: {unvisited_missing}; failures: {failures}; '
                f'live verified: {live_verified}; live pending: {live_pending}; '
                f'progress: {progressed}; stalled runs: {state["no_progress_runs"]}')
          PY

      - name: Audit unresolved pages and why they are pending
        if: steps.gate.outputs.build == 'true'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return {}

          manifest = read('public/i18n/manifest.json')
          coverage = read('public/i18n/coverage.json')
          audit = read('public/i18n/audit.json')
          live_qa = read('public/i18n/live-qa.json')
          pending = audit.get('pending_pages') or []
          failed = coverage.get('skipped_or_failed') or []
          unvisited = coverage.get('unvisited_examples') or []
          print('---- PUBLIC TRANSLATION BACKLOG DIAGNOSTICS ----')
          print('Pages pending:', manifest.get('pages_pending', 'n/a'))
          print('Live EN/ZH verified:',live_qa.get('public_routes_verified',0),'/',
                live_qa.get('public_routes_total','unknown'))
          print('Live QA failures:',live_qa.get('failed_examples',[])[:10])
          print('Pages beyond crawl budget:', coverage.get('unvisited_count', 'n/a'))
          print('Pages lacking a pack beyond crawl budget:', coverage.get('unvisited_without_existing_pack', 'n/a'))
          print('Fetch failures:', len(failed))
          print('Redirected/deleted legacy URLs (not pending):', len(coverage.get('inactive_redirects_or_404', [])))
          print('Pages with incomplete translations:', len(pending))
          print('Pending incomplete pages (up to 30):')
          for p in pending[:30]:
              print(' INCOMPLETE', p.get('route', ''), 'missing texts:', p.get('missing_count', '?'))
          print('Failed URL fetches (up to 30):')
          for f in failed[:30]:
              print(' FETCH_ERROR', f.get('url', ''), ':', f.get('error', ''))
          print('Unvisited examples (up to 30):')
          for url in unvisited[:30]:
              print(' UNVISITED', url)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Translation backlog diagnostic\n\n')
              out.write(f'- Pending packs: {manifest.get("pages_pending", "n/a")}\n')
              out.write(f'- EN/ZH live pages verified: {live_qa.get("public_routes_verified",0)} / {live_qa.get("public_routes_total","unknown")}\n')
              out.write(f'- Unvisited URLs: {coverage.get("unvisited_count", "n/a")}\n')
              out.write(f'- Unvisited without a pack: {coverage.get("unvisited_without_existing_pack", "n/a")}\n')
              out.write(f'- Fetch errors: {len(failed)}\n')
              out.write(f'- Redirected/deleted aliases (excluded): {len(coverage.get("inactive_redirects_or_404", []))}\n')
              out.write(f'- Pages with missing translation strings: {len(pending)}\n')
              for row in pending[:12]:
                  out.write(f'  - {row.get("route", "unknown")}: {row.get("missing_count", "?")} strings missing\n')
              for row in failed[:8]:
                  out.write(f'  - Fetch error {row.get("url", "unknown")}: {str(row.get("error", ""))[:100]}\n')
          PY

      - name: Persist generated packs and progress
        id: persist
        if: steps.gate.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LuuLe-i18n-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add translation-cache.json public/i18n/ .ll-i18n-state.json
          if git diff --cached --quiet; then
            echo 'No new translations to commit.'
            echo 'result=published' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: refresh translation packs and progress'
          # Never force push. If main changed during this long build and JSON
          # cannot safely rebase, abort the stale commit and ask the next run
          # to rebuild FROM CURRENT MAIN. Existing published packs stay intact.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3: fetching current main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::warning::Generated JSON conflicts with newer main. Keeping remote data; scheduling a fresh batch.'
              echo 'result=conflict' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin HEAD:main; then
              echo 'Successfully published translation packs and progress.'
              echo 'result=published' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Remote branch moved again (attempt ${attempt}); retrying."
            sleep $((attempt * 3))
          done
          echo '::error::Push rejected three times; check branch protection and repository permission.'
          exit 1

      - name: Automatically continue translation backlog
        # Explicit workflow_dispatch works with GITHUB_TOKEN (unlike a push
        # made by GITHUB_TOKEN). One queued successor at a time.
        if: steps.gate.outputs.build == 'true' && (steps.persist.outputs.result == 'published' || steps.persist.outputs.result == 'conflict')
        env:
          PERSIST_RESULT: ${{ steps.persist.outputs.result }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  return {}

          manifest = load('public/i18n/manifest.json')
          audit = load('public/i18n/audit.json')
          coverage = load('public/i18n/coverage.json')
          state = load('.ll-i18n-state.json')
          qa = load('public/i18n/live-qa.json')
          live_pending = int(qa.get('public_routes_pending', 1))
          live_verified = int(qa.get('public_routes_verified', 0))
          pending = int(manifest.get('pages_pending', 0))
          partial = int(audit.get('pages_pending', 0))
          missing_texts = int(audit.get('missing_unique_texts', 0))
          unvisited_missing = int(coverage.get('unvisited_without_existing_pack', 0))
          failures = len(coverage.get('skipped_or_failed', []))
          stalls = int(state.get('no_progress_runs', 0))
          conflict = os.getenv('PERSIST_RESULT') == 'conflict'
          try:
              depth = max(0, int(os.getenv('CHAIN_DEPTH', '0')))
          except ValueError:
              depth = 0
          unfinished = any((pending, partial, missing_texts, unvisited_missing, failures, live_pending))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Luu Le translation coverage and continuation\n\n')
              out.write(f'- Pending JSON packs: {pending}\n')
              out.write(f'- Incomplete translated pages: {partial}\n')
              out.write(f'- Missing unique strings: {missing_texts}\n')
              out.write(f'- Unvisited URLs without packs: {unvisited_missing}\n')
              out.write(f'- Failed page fetches needing retry: {failures}\n')
              out.write(f'- Redirected/deleted legacy URL aliases: {len(coverage.get("inactive_redirects_or_404", []))}\n')
              out.write(f'- No-progress runs: {stalls}\n')
              out.write(f'- EN/ZH live verified: {live_verified}; live pending: {live_pending}\n')
              out.write(f'- Chain index: {depth} (no fixed batch limit)\n')

          # The 933/933 static JSON-pack count is NOT proof of full
          # website translation. Continue one queued batch at a time until
          # BOTH static coverage and rolling anonymous EN/ZH live checks pass.
          # Stagnation is reported but is not a silent termination condition.
          if conflict:
              reason = 'Conflicting generated JSON; rebuild from fresh main'
          elif not unfinished:
              print('Static packs and currently discovered anonymous public '
                    'routes passed EN/ZH checks. Daily discovery stays active.')
              reason = None
          else:
              if stalls >= 3:
                  print('::warning::Repeated no-progress runs; inspect live-qa.json '
                        'and unblock source-data, CDN or browser errors.')
              reason = 'Unverified public EN/ZH page content remains'

          if reason:
              repo = os.environ['GITHUB_REPOSITORY']
              request = Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/build-i18n.yml/dispatches',
                  data=json.dumps({'ref': 'main',
                                   'inputs': {'chain_depth': str(depth+1)}}).encode('utf-8'),
                  method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'LuuLePublicTranslationBot'})
              with urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError('Unexpected dispatch status ' + str(response.status))
              print(f'Queued next GitHub Actions batch #{depth+1}: {reason}.')
          PY
